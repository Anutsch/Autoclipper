<!doctype html><html lang="de"><meta charset="utf-8"><style>:root{color-scheme:dark;font:11px -apple-system,BlinkMacSystemFont,system-ui;--muted:#a0a9b4;--line:#ffffff15;--blue:#6eb5ff}*{box-sizing:border-box}body{margin:0;padding:14px;min-width:230px;color:#edf1f5;background:radial-gradient(ellipse at 100% 0,#34425080,transparent 65%),#23262b}header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.brand{display:flex;gap:8px;align-items:center}.mark{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;border:1px solid #ffffff27;background:linear-gradient(145deg,#ffffff23,#ffffff08);box-shadow:inset 0 1px #ffffff12}h1{font-size:14px;font-weight:600;letter-spacing:-.4px;margin:0}header small{display:block;font-size:8px;color:var(--muted);margin-top:2px}.badge{font-size:8px;color:#b3d6c4;border:1px solid #ffffff20;border-radius:20px;padding:5px 7px;background:#ffffff09}h2{font-size:8px;letter-spacing:1px;color:#98a5b3;font-weight:500;margin:14px 0 7px}.target{background:linear-gradient(135deg,#ffffff13,#ffffff06);border:1px solid #ffffff20;border-radius:14px;padding:12px;box-shadow:inset 0 1px #ffffff0c,0 5px 15px #00000008;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}.row{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}.label{font-size:9px;color:var(--muted)}.value{font-size:11px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.format{font-size:9px;color:#a9b7c6;border-top:1px solid var(--line);padding-top:9px;margin:9px 0 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}button{background:linear-gradient(145deg,#ffffff18,#ffffff08);border:1px solid #ffffff23;border-radius:20px;box-shadow:inset 0 1px #ffffff0c;color:#d7e1ec;font:10px -apple-system,system-ui;padding:8px 10px;cursor:pointer}button:hover{background:#ffffff1c}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}#jump{color:#add2fa}#status{font-size:10px;line-height:1.6;color:#a9b8c7;overflow-wrap:anywhere;margin:8px 0 0}.job{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.job strong{font-size:10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.job span{font-size:9px;color:var(--muted);text-align:right;flex-shrink:0;max-width:50%}.empty{font-size:10px;color:var(--muted);line-height:1.6}.error{color:#f2a99e!important}.success{color:#a5cdb6!important}.foot{font-size:8px;color:#83919f;line-height:1.6;margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}[hidden]{display:none!important}@media(prefers-reduced-transparency:reduce){.target{background:#30353b;backdrop-filter:none;-webkit-backdrop-filter:none}}
.app-logo{width:32px;height:32px;object-fit:contain;border-radius:8px}</style><header><div class="brand"><img class="app-logo" src="logo.png" alt="Autoclipper"><div><h1>Autoclipper</h1></div></div><span id="connection" class="badge">Verbinde …</span></header><section class="target"><div class="row"><span class="label">Projekt</span><span class="value" id="project">Noch nicht verbunden</span></div><div class="row"><span class="label">Sequenz</span><span class="value" id="sequence">Noch keine Sequenz</span></div><p class="format" id="format">1080 × 1920 · 30 fps</p><div class="actions"><button id="newProject">Neues Projekt</button><button id="jump" disabled>Sequenz öffnen ↗</button></div></section><h2>CLIPS</h2><div id="jobs" class="empty">Keine Clips.</div><div id="status" role="status" aria-live="polite">Verbinden …</div><div class="actions"><button id="retry" hidden>Erneut importieren</button></div><script src="panel.js"></script></html>
